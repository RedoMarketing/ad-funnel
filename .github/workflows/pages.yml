name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          PAGES_BASE_PATH: /ad-funnel

      # GitHub Pages serves HTML with cache-control: max-age=600, but every
      # deploy replaces the hashed chunks and deletes the old ones. For ten
      # minutes after a deploy, anyone holding cached HTML requests a
      # stylesheet that 404s and gets an unstyled page. Shipping the previous
      # build's assets alongside the new ones closes that window.
      - name: Restore the previous build's assets
        uses: actions/cache/restore@v4
        with:
          path: .previous-static
          key: pages-static-${{ github.run_id }}
          restore-keys: |
            pages-static-

      - name: Carry old chunks forward
        run: |
          set -euo pipefail
          # Stash this build untouched — only one generation is ever cached,
          # so the site holds at most two and the cache cannot grow forever.
          rm -rf .current-static
          cp -r out/_next/static .current-static
          if [ -d .previous-static ]; then
            # -n keeps the new build's files when names collide.
            cp -rn .previous-static/. out/_next/static/ || true
            echo "carried forward: $(find .previous-static -type f | wc -l) files"
          else
            echo "no previous build cached; first run"
          fi
          rm -rf .previous-static
          mv .current-static .previous-static

      # Handed to the deploy job, which caches it only if the deploy lands.
      # Saving here instead would let a failed deploy overwrite the last
      # generation that actually shipped, which is exactly what happened
      # during a Pages outage: repeated builds of one commit evicted it.
      - uses: actions/upload-artifact@v4
        with:
          name: pristine-static
          path: .previous-static
          retention-days: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Only now is this generation genuinely live, so only now is it the
      # thing the next build should carry forward.
      - uses: actions/download-artifact@v4
        with:
          name: pristine-static
          path: .previous-static
      - uses: actions/cache/save@v4
        with:
          path: .previous-static
          key: pages-static-${{ github.run_id }}
